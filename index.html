
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIBE WAVE | Music Player</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <nav class="header">

        <div class="brand">
            <span class="brand-icon">♫</span>
            VIBE <span>WAVE</span>
        </div>

        <div class="search-box">

            <input
                id="inputValue"
                class="form-control input-styling"
                type="search"
                placeholder="Find your favourite song..."
            >

            <button class="button" id="searchBtn">
                Search
            </button>

        </div>

    </nav>


    <section class="hero-section">

        <div class="hero-content">

            <p class="welcome-text">YOUR MUSIC. YOUR VIBE.</p>

            <h1>Feel Every <span>Beat.</span></h1>

            <p class="description">
                Discover your favourite music and enjoy every moment.
            </p>

        </div>


        <div id="spinner" class="music-loader">
            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>Finding your favourite songs...</p>
        </div>


        <div class="container" id="container">

        </div>

    </section>

    <script src="script2.js"></script>

</body>
</html>
